<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会务系统 - 后台管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .table-row:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- 登录页（默认显示，登录后隐藏） -->
    <div id="loginView" class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md bg-white rounded-lg shadow-md p-6">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">后台管理员登录</h1>
                    <p class="text-sm text-gray-500 mt-1">登录后才可查看与管理用户数据</p>
                </div>
                <div class="text-gray-400">
                    <i class="ri-shield-keyhole-line text-xl"></i>
                </div>
            </div>

            <form id="loginForm" class="mt-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">管理员邮箱</label>
                    <input type="email" id="adminEmailInput" autocomplete="username" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="admin@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="adminPasswordInput" autocomplete="current-password" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入密码">
                </div>
                <button id="loginBtn" type="submit" class="w-full bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition flex items-center justify-center gap-2">
                    <i class="ri-login-box-line"></i>
                    <span>登录</span>
                </button>
                <p id="loginError" class="hidden text-sm text-red-500"></p>
            </form>

            <div class="mt-4 text-xs text-gray-400 leading-relaxed">
                <p id="adminHint"></p>
                <p class="mt-1">提示：管理员账号需要在 Supabase Auth 里创建；后台写入权限由 RLS 策略控制。</p>
            </div>
        </div>
    </div>

    <!-- 管理后台（登录后显示） -->
    <div id="appView" class="hidden container mx-auto px-4 py-8 max-w-7xl">
        <!-- 头部 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">会务系统后台管理</h1>
                    <p class="text-gray-500 mt-1">用户数据管理系统</p>
                </div>
                <div class="flex gap-3 items-center">
                    <span id="adminEmail" class="hidden md:inline text-sm text-gray-500"></span>
                    <button onclick="logout()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition flex items-center gap-2">
                        <i class="ri-logout-box-line"></i>
                        退出登录
                    </button>
                    <button onclick="exportToExcel()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition flex items-center gap-2">
                        <i class="ri-file-excel-line"></i>
                        导出Excel
                    </button>
                    <label class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition flex items-center gap-2 cursor-pointer">
                        <i class="ri-upload-2-line"></i>
                        导入Excel
                        <input type="file" id="importFile" accept=".xlsx,.xls" class="hidden" onchange="importFromExcel(this)">
                    </label>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow-md p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">总用户数</p>
                        <p class="text-2xl font-bold text-blue-600" id="totalCount">0</p>
                    </div>
                    <div class="bg-blue-100 p-3 rounded-full">
                        <i class="ri-user-line text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">今日新增</p>
                        <p class="text-2xl font-bold text-green-600" id="todayCount">0</p>
                    </div>
                    <div class="bg-green-100 p-3 rounded-full">
                        <i class="ri-user-add-line text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">已分配座位</p>
                        <p class="text-2xl font-bold text-purple-600" id="seatCount">0</p>
                    </div>
                    <div class="bg-purple-100 p-3 rounded-full">
                        <i class="ri-armchair-line text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">已分配酒店</p>
                        <p class="text-2xl font-bold text-orange-600" id="hotelCount">0</p>
                    </div>
                    <div class="bg-orange-100 p-3 rounded-full">
                        <i class="ri-hotel-line text-orange-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加/编辑用户表单 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="ri-user-add-line text-blue-500"></i>
                <span id="formTitle">添加用户</span>
            </h2>
            <form id="userForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input type="hidden" id="editId" value="">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
                    <input type="text" id="name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入姓名">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">手机号 <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入手机号">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">酒店</label>
                    <input type="text" id="hotel" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入酒店">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">座位号</label>
                    <input type="text" id="seatNumber" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入座位号">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">餐席号</label>
                    <input type="text" id="mealNumber" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入餐席号">
                </div>
                <div class="md:col-span-5 flex gap-3">
                    <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition flex items-center gap-2">
                        <i class="ri-save-line"></i>
                        <span id="submitBtnText">保存</span>
                    </button>
                    <button type="button" onclick="resetForm()" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400 transition flex items-center gap-2">
                        <i class="ri-refresh-line"></i>
                        重置
                    </button>
                </div>
            </form>
        </div>

        <!-- 搜索和筛选 -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex flex-wrap gap-4">
                <div class="flex-1 min-w-[200px]">
                    <input type="text" id="searchInput" oninput="searchUsers()" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="搜索姓名、手机号、酒店...">
                </div>
                <button onclick="clearAllData()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition flex items-center gap-2">
                    <i class="ri-delete-bin-line"></i>
                    清空所有数据
                </button>
            </div>
        </div>

        <!-- 用户列表 -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">序号</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">手机号</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">酒店</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">座位号</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">餐席号</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-gray-200">
                        <!-- 动态生成 -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="hidden py-12 text-center">
                <i class="ri-inbox-line text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500">暂无用户数据</p>
                <p class="text-gray-400 text-sm mt-2">点击"导入Excel"或添加用户</p>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-2">
        <i class="ri-check-line"></i>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        /* Legacy admin code (disabled). */

        // 更新统计数据
        function updateStats() {

        function searchUsers() {

        // 渲染表格

        // 编辑用户

        // 删除用户
        async function deleteUser(index) {

                        .delete()

                    if (error) {
                        throw error;
                    }
                    
                    // 重新加载数据
                    await loadUsers();
                    renderTable();
                    showToast('用户删除成功');

                    showToast('删除失败: ' + error.message, 'error');

        function resetForm() {

            document.getElementById('editId').value = '';
            document.getElementById('formTitle').textContent = '添加用户';
            document.getElementById('submitBtnText').textContent = '保存';
        }

        // 导入 Excel
        function importFromExcel(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    
                    if (jsonData.length === 0) {
                        showToast('Excel 文件为空', 'error');
                        return;
                    }
                    
                    let addedCount = 0;
                    let updatedCount = 0;
                    
                    jsonData.forEach(row => {
                        const name = row['姓名'] || row['name'] || '';
                        const phone = row['手机号'] || row['phone'] || '';
                        const hotel = row['酒店'] || row['hotel'] || '';
                        const seatNumber = row['座位号'] || row['seatNumber'] || '';
                        const mealNumber = row['餐席号'] || row['mealNumber'] || '';
                        
                        if (!name || !phone) return;
                        
                        const userData = {
                            name: String(name).trim(),
                            phone: String(phone).trim(),
                            hotel: String(hotel).trim(),
                            seatNumber: String(seatNumber).trim(),
                            mealNumber: String(mealNumber).trim(),
                            updatedAt: new Date().toISOString()
                        };
                        
                        const existingIndex = users.findIndex(u => 
                            u.name === userData.name || u.phone === userData.phone
                        );
                        
                        if (existingIndex !== -1) {
                            userData.createdAt = users[existingIndex].createdAt;
                            users[existingIndex] = userData;
                            updatedCount++;
                        } else {
                            userData.createdAt = new Date().toISOString();
                            users.push(userData);
                            addedCount++;
                        }
                    });
                    
                    saveUsers();
                    renderTable();
                    showToast(`导入成功！新增 ${addedCount} 条，更新 ${updatedCount} 条`);
                    
                } catch (error) {
                    console.error(error);
                    showToast('导入失败，请检查文件格式', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            input.value = '';
        }

        // 导出 Excel
        function exportToExcel() {
            if (users.length === 0) {

                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                        if (!jsonData || jsonData.length === 0) {
                            showToast('Excel 文件为空', 'error');
                            return;
                        }

                        const existingPhones = new Set(users.map(u => String(u.phone || '')));
                        let addedCount = 0;
                        let updatedCount = 0;

                        const payloads = [];
                        for (let i = 0; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            const name = row['姓名'] || row['name'] || '';
                            const phone = row['手机号'] || row['phone'] || '';
                            const hotel = row['酒店'] || row['hotel'] || '';
                            const seatNumber = row['座位号'] || row['seatNumber'] || row['seat_number'] || '';
                            const mealNumber = row['餐席号'] || row['mealNumber'] || row['meal_number'] || '';

                            if (!name || !phone) continue;

                            const inputUser = {
                                name: String(name).trim(),
                                phone: String(phone).trim(),
                                hotel: String(hotel).trim(),
                                seatNumber: String(seatNumber).trim(),
                                mealNumber: String(mealNumber).trim()
                            };

                            if (existingPhones.has(inputUser.phone)) updatedCount++;
                            else {
                                existingPhones.add(inputUser.phone);
                                addedCount++;
                            }

                            payloads.push(buildDbPayload(inputUser, 'insert'));
                        }

                        if (payloads.length === 0) {
                            showToast('未识别到有效数据（至少需要姓名+手机号）', 'error');
                            return;
                        }

                        const chunks = [];
                        for (let i = 0; i < payloads.length; i += 200) chunks.push(payloads.slice(i, i + 200));

                        let usedFallback = false;
                        try {
                            for (let i = 0; i < chunks.length; i++) {
                                const { error } = await supabaseClient
                                    .from('conference_users')
                                    .upsert(chunks[i], { onConflict: 'phone' });
                                if (error) throw error;
                            }

                            console.warn('upsert 失败，降级为逐条写入：', err);
                            usedFallback = true;
                            for (let i = 0; i < payloads.length; i++) {

                                        .from('conference_users')
                                        .update(p)
                                        .eq('id', existed.id);
                                    if (error) throw error;
                                } else {

                                        .from('conference_users')
                                        .insert(p);
                                    if (error) throw error;
                                }
                            }
                        }

                        showToast(`导入完成：新增 ${addedCount} 条，更新 ${updatedCount} 条${usedFallback ? '（降级模式）' : ''}`);
                    } catch (err) {
                        console.error(err);
                        showToast('导入失败：' + (err && err.message ? err.message : '未知错误'), 'error');
                    } finally {
                        if (input) input.value = '';
                    }
                };

                reader.readAsArrayBuffer(file);
            }

                            if (loginBtn) {
                                loginBtn.disabled = true;
                                loginBtn.querySelector('span').textContent = '登录中...';
                            }

                            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                            if (error) throw error;

                            await showApp(data.session);
                            showToast('登录成功');
                        } catch (err) {
                            console.error(err);
                            if (loginError) {
                                loginError.textContent = '登录失败：' + (err && err.message ? err.message : '未知错误');
                                setHidden(loginError, false);
                            }
                        } finally {
                            if (loginBtn) {
                                loginBtn.disabled = false;
                                loginBtn.querySelector('span').textContent = '登录';
                            }
                        }
                    });
                }

                $('userForm').addEventListener('submit', handleSubmit);
            }

            document.addEventListener('DOMContentLoaded', bootstrap);
        })();
    </script>
</body>
</html>
